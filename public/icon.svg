<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Mathosaur</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#5ccf73"/>
      <stop offset="1" stop-color="#1f7a41"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- faint maths symbols -->
    <g fill="#ffffff" opacity="0.16" font-family="Arial, Helvetica, sans-serif" font-weight="700">
      <text x="44" y="128" font-size="96">×</text>
      <text x="56" y="300" font-size="72">÷</text>
      <text x="430" y="470" font-size="70">=</text>
    </g>

    <!-- neck / body rising from the bottom edge -->
    <path d="M118 560 C 112 440 130 380 176 340 L 300 360 C 300 430 310 500 330 560 Z"
          fill="#9be06a" stroke="#1b5e30" stroke-width="14" stroke-linejoin="round"/>
    <path d="M196 560 C 196 470 210 420 238 392 L 286 398 C 282 450 288 510 300 560 Z" fill="#d6f5b5"/>

    <!-- back spikes (gold, poking out from behind the head) -->
    <g fill="#ffc83d" stroke="#1b5e30" stroke-width="10" stroke-linejoin="round">
      <path d="M112 231 L 58 176 L 136 167 Z"/>
      <path d="M140 162 L 126 84 L 196 123 Z"/>
      <path d="M202 121 L 236 50 L 270 121 Z"/>
    </g>

    <!-- head -->
    <circle cx="236" cy="240" r="124" fill="#9be06a" stroke="#1b5e30" stroke-width="14"/>
    <!-- snout -->
    <ellipse cx="350" cy="286" rx="96" ry="74" fill="#9be06a" stroke="#1b5e30" stroke-width="14"/>
    <!-- hide the seam between head and snout -->
    <path d="M250 214 Q 300 230 300 300 Q 280 330 240 330 Z" fill="#9be06a"/>

    <!-- nostrils -->
    <circle cx="404" cy="262" r="8" fill="#1b5e30"/>
    <circle cx="374" cy="266" r="8" fill="#1b5e30"/>

    <!-- cheek -->
    <circle cx="286" cy="292" r="20" fill="#ff8fa0" opacity="0.7"/>

    <!-- eye -->
    <circle cx="258" cy="206" r="44" fill="#ffffff" stroke="#1b5e30" stroke-width="10"/>
    <circle cx="270" cy="212" r="24" fill="#1a1a1a"/>
    <circle cx="279" cy="201" r="8" fill="#ffffff"/>

    <!-- smile -->
    <path d="M310 318 Q 362 362 424 310" fill="none" stroke="#1b5e30" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- gold plus badge -->
  <circle cx="404" cy="108" r="64" fill="#ffd23f" stroke="#c99a00" stroke-width="10"/>
  <path d="M404 74 V 142 M 370 108 H 438" stroke="#7a5600" stroke-width="20" stroke-linecap="round"/>
</svg>
